name: Deploy to Firebase Hosting
on: pull_request # merge用ファイルならここが push: branches: [main] になります
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  # ジョブ名を画像に合わせて修正（または統一）
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # package-lock.jsonがある場所を指定
          cache-dependency-path: './my-study-app/package-lock.json'

      - name: Install and Build
        # 【重要】my-study-app フォルダ内で実行するように指定
        working-directory: ./my-study-app
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_MYSTUDYMANAGER }}
          projectId: app-mystudymanager
          # 【重要】デプロイ対象のフォルダを指定
          entryPoint: ./my-study-app