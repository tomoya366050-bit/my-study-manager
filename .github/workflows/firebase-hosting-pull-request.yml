name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Node.js環境を整える（安定性のために追加）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. 必要なライブラリをインストール（これが抜けていたためエラーになっていました）
      - name: Install dependencies
        run: npm ci

      # 3. 本番用ファイルをビルド
      - name: Build project
        run: npm run build

      # 4. Firebaseにプレビュー版をデプロイ
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_MYSTUDYMANAGER }}
          projectId: app-mystudymanager