name: Deploy to Firebase Hosting on Merge
on:
  push:
    branches:
      - main # mainブランチに反映（Merge）されたときに動く
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './my-study-app/package-lock.json'

      - name: Install and Build
        # ★重要：あなたのプロジェクト構造に合わせたパス指定
        working-directory: ./my-study-app
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_MYSTUDYMANAGER }}
          projectId: app-mystudymanager
          # ★PR版と違い、本番（live）サイトを更新するように指定
          channelId: live
          entryPoint: ./my-study-app